---
name: Changelog Generator
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  check-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check PR metadata for an enriched package
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const supportedSources = new Set([
              "cloudflare/cloudflared",
              "spegel-org/spegel",
              "qbittorrent/qbittorrent",
              "bjw-s-labs/helm-charts",
              "kubernetes/kubernetes",
              "siderolabs/kubelet",
              "atuinsh/atuin",
            ]);
            const body = context.payload.pull_request.body ?? "";
            const sourceUrls = body.matchAll(
              /^\|\s*\[[^\]]+\]\(https:\/\/(?:redirect\.)?github\.com\/([^/)]+\/[^/)#?]+)\)/gim,
            );
            const shouldRun = /^\|\s*(?:ghcr\.io\/(?:atuinsh\/atuin|siderolabs\/kubelet)|registry\.k8s\.io\/kube-(?:apiserver|controller-manager|proxy|scheduler))\s*\|/im.test(body) || Array.from(sourceUrls).some((match) =>
              supportedSources.has(match[1].toLowerCase()),
            );

            core.setOutput("should_run", shouldRun);
            core.info(`Matched enriched package: ${shouldRun}`);

  generate-changelog:
    name: Generate Changelog
    needs: check-package
    if: >-
      github.event.pull_request.user.login == 'snoopy82481-bot[bot]' &&
      needs.check-package.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          pip install requests pyyaml beautifulsoup4

      - name: Run enrich script
        id: enrich
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: INFO
        run: |
          NEW_BODY="$(PYTHONPATH=.github python3 -m scripts.enrich.main)"
          delimiter="$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            printf '%s\n' "$NEW_BODY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Apply PR update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const newBody = process.env.PR_BODY;
            if (!newBody?.trim()) {
              throw new Error("Generated PR body is empty");
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });
        env:
          PR_BODY: ${{ steps.enrich.outputs.body }}
