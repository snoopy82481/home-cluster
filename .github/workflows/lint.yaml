---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Currently no way to detect automatically
  DEFAULT_BRANCH: main

jobs:
  filter:
    name: changed files
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.markdown.outputs.changed_files }}
      oxfmt: ${{ steps.oxfmt.outputs.changed_files }}
      yaml: ${{ steps.yaml.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get changed YAML files
        id: yaml
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            **.yml
            **.yaml

      - name: Get changed Markdown files
        id: markdown
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            **.md

      - name: Get changed Oxfmt files
        id: oxfmt
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            **.cjs
            **.css
            **.cts
            **.gql
            **.graphql
            **.graphqls
            **.handlebars
            **.hbs
            **.htm
            **.html
            **.js
            **.json
            **.json5
            **.jsonc
            **.jsx
            **.less
            **.markdown
            **.md
            **.mdx
            **.mjml
            **.mjs
            **.mts
            **.pcss
            **.postcss
            **.scss
            **.svelte
            **.toml
            **.ts
            **.tsx
            **.vue
            **.yaml
            **.yml

  yamllint:
    if: >-
      ${{
        needs.filter.outputs.yaml != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: yamllint
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yaml: ${{ fromJSON(needs.filter.outputs.yaml) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install yamllint
        shell: bash
        run: |
          pip install --user yamllint

      - name: Run yamllint
        env:
          YAML_FILE: ${{ matrix.yaml }}
        run: |
          yamllint --config-file .github/linters/.yamllint.yaml --format github "$YAML_FILE"

  markdownlint:
    if: >-
      ${{
        needs.filter.outputs.markdown != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: markdownlint
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        markdown: ${{ fromJSON(needs.filter.outputs.markdown) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run markdownlint-cli2
        env:
          MARKDOWN_FILE: ${{ matrix.markdown }}
        uses: bjw-s/action-markdownlint-cli2@c3c44cc6f77516007f1a85d982ed6276e840dcec # v0.1
        with:
          markdownlint_config: .github/linters/.markdownlint.yaml
          file_pattern: ${{ env.MARKDOWN_FILE }}

  oxfmt:
    if: >-
      ${{
        needs.filter.outputs.oxfmt != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: oxfmt
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        oxfmt: ${{ fromJSON(needs.filter.outputs.oxfmt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run oxfmt
        env:
          OXFMT_FILE: ${{ matrix.oxfmt }}
        run: |
          npx --yes oxfmt@0.64.0 --check --no-error-on-unmatched-pattern "$OXFMT_FILE"

  lint_success:
    needs:
      - filter
      - oxfmt
      - yamllint
      - markdownlint
    if: |
      always()
    name: Lint successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: >-
          ${{
              (
                contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              )
          }}
        run: exit 1
