min_version = "2026.11.3"
monorepo_root = true

[env]
FLATE_PATH = '{{config_root}}/kubernetes/apps'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[hooks]
postinstall = "lefthook install"

# Shell completion runs this outside the task environment, from the caller's directory.
[task_templates.node]
usage = '''
complete "node" run="find \"$(git rev-parse --show-toplevel)/talos/nodes/controlplane\" -name '*.yaml.j2' ! -name '*.schematic.yaml.j2' -exec basename {} .yaml.j2 \\; | sort"
'''

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# Runs in the caller's directory, so callers pass template paths relative to it.
[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
doppler_context="$(doppler secrets download --project home-cluster --config prd_kubernetes --format json --no-file --no-fallback --no-check-version </dev/null | jq 'map_values(. as $value | try (fromjson | if type == "object" or type == "array" then . else $value end) catch $value)')"
minijinja-cli --format json "$usage_file" <(printf '%s\n' "$doppler_context") "${args[@]}"
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
config_roots = ["bootstrap", "infrastructure", "kubernetes", "talos"]

[settings]
task.quiet = true
