<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title description">
  <title id="title">Home network overview</title>
  <desc id="description">Internet through a NETGEAR CM1200 modem and virtualized pfSense router to a Cisco main switch. Branches summarize wired clients and the Cisco CBS350, three wireless access points, six Talos nodes, and TrueNAS. Seven networks are listed with their subnets; all gateways use the .1 address.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#e7e5df" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { fill: #f1efe8; font-family: 'Chalkboard SE', 'Comic Sans MS', 'DejaVu Sans', sans-serif; text-anchor: middle; }
      .heading { font-size: 32px; font-weight: 600; letter-spacing: 2px; }
      .label { font-size: 25px; }
      .small { font-size: 19px; fill: #b7bec4; }
      .network { font-size: 22px; text-anchor: start; }
      .subnet { font-family: 'DejaVu Sans Mono', monospace; font-size: 21px; text-anchor: end; }
      .wire { fill: none; stroke: #e7e5df; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-start: url(#arrow); marker-end: url(#arrow); }
      .outline { fill: none; stroke: #e7e5df; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .echo { fill: none; stroke: #e7e5df; stroke-width: 0.8; opacity: .35; }
    </style>
  </defs>
