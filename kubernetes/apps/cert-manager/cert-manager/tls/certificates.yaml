---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idahobealefamily-com-production
spec:
  secretName: idahobealefamily-com-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: idahobealefamily.com
  dnsNames:
    - idahobealefamily.com
    - "*.idahobealefamily.com"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idahobealefamily-com-staging
spec:
  secretName: idahobealefamily-com-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: idahobealefamily.com
  dnsNames:
    - idahobealefamily.com
    - "*.idahobealefamily.com"
