---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      qui:
        containers:
          qui:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.30.0@sha256:1172ca40283330445d61189263a65a31ba703770a230b9e2a913f6e57bc2dd23

            env:
              QUI__AUTH_DISABLED: true
              QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: true
              QUI__AUTH_DISABLED_ALLOWED_CIDRS: 0.0.0.0/0
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 80
              QUI__METRICS_ENABLED: true
              QUI__METRICS_HOST: 0.0.0.0
              QUI__METRICS_PORT: &metricsPort 8080
              TZ: America/Boise

            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              readOnlyRootFilesystem: true

    externalSecrets:
      qui:
        enabled: true
        data:
          - remoteRef:
              key: QUI_SESSION_SECRET
            secretKey: QUI_SESSION_SECRET
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: doppler
        target:
          creationPolicy: Owner
          deletionPolicy: Delete
          name: qui-secret
          template:
            data:
              QUI__SESSION_SECRET: "{{ .QUI_SESSION_SECRET }}"
            engineVersion: v2

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"

      media:
        type: nfs
        path: /mnt/storage1/data
        server: truenas.internal
        globalMounts:
          - path: /media

      tmpfs:
        type: emptyDir
        advancedMounts:
          qui:
            qui:
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp

    route:
      qui:
        enabled: true
        annotations:
          gethomepage.dev/description: A fast, modern web interface for qBittorrent. Supports managing multiple qBittorrent instances from a single, lightweight application.
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/qui-light.svg
          gethomepage.dev/name: qui
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"

        parentRefs:
          - name: envoy-internal
            namespace: networking

    service:
      qui:
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort

    serviceMonitor:
      qui:
        endpoints:
          - port: metrics
