---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          radarr:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e

            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__ALLOWEDHOSTS: "*"
              RADARR__SERVER__PORT: &port 7878
              RADARR__UPDATE__BRANCH: develop
              TZ: America/Boise

            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"

              readOnlyRootFilesystem: true

    externalSecrets:
      radarr:
        enabled: true
        dataFrom:
          - extract:
              key: RADARR

        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: doppler
        target:
          creationPolicy: Owner
          deletionPolicy: Delete
          name: radarr-secret
          template:
            data:
              RADARR__AUTH__APIKEY: "{{ .RADARR_APIKEY }}"
            engineVersion: v2

    persistence:
      backup:
        type: nfs
        path: /mnt/storage0/backup
        server: truenas.internal
        globalMounts:
          - path: /backup
            subPath: "{{ .Release.Name }}"
      config:
        existingClaim: "{{ .Release.Name }}"

      media:
        type: nfs
        path: /mnt/storage1/data
        server: truenas.internal
        globalMounts:
          - path: /media

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp

    route:
      radarr:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"

        parentRefs:
          - name: envoy-internal
            namespace: networking

    service:
      radarr:
        controller: radarr
        ports:
          http:
            port: *port
