---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml

configMapGenerator:
  - name: recyclarr-configs
    files:
      - ./resources/sonarr-config.yaml
      - ./resources/sonarr-anime-config.yaml
      - ./resources/sonarr-uhd-config.yaml
      - ./resources/radarr-config.yaml
      - ./resources/radarr-anime-config.yaml
      - ./resources/radarr-uhd-config.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
