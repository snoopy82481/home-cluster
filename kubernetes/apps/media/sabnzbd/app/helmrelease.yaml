---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          sabnzbd:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104
            env:
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.media,
                sabnzbd.media.svc,
                sabnzbd.media.svc.cluster,
                sabnzbd.media.svc.cluster.local,
                {{ .Release.Name }}.idahobealefamily.com

              SABNZBD__PORT: &port 8080
              TZ: America/Boise
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes

            resources:
              requests:
                cpu: 100m
              limits:
                memory: 8Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              readOnlyRootFilesystem: true

    externalSecrets:
      sabnzbd:
        enabled: true
        dataFrom:
          - extract:
              key: SABNZBD
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: doppler
        target:
          creationPolicy: Owner
          deletionPolicy: Delete
          name: sabnzbd-secret
          template:
            data:
              SABNZBD__API_KEY: "{{ .SABNZBD_API_KEY }}"
              SABNZBD__NZB_KEY: "{{ .SABNZBD_NZB_KEY }}"
            engineVersion: v2

    persistence:
      backup:
        type: nfs
        path: /mnt/storage0/backup
        server: truenas.internal
        globalMounts:
          - path: /backup
            subPath: "{{ .Release.Name }}"

      config:
        existingClaim: "{{ .Release.Name }}"

      media:
        type: nfs
        path: /mnt/storage1/data
        server: truenas.internal
        globalMounts:
          - path: /media

      scripts:
        type: configMap
        defaultMode: 0755
        name: sabnzbd-scripts
        globalMounts:
          - path: /scripts/clean.py
            readOnly: true
            subPath: clean.py
          - path: /scripts/replace_for.py
            readOnly: true

            subPath: replace_for.py
      tmp:
        type: emptyDir

    route:
      sabnzbd:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: sabnzbd
                port: *port

    service:
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: *port
