---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  values:
    controllers:
      gatus:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000

        initContainers:
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.6.0@sha256:1d3e6b0c50b9addcbbc68b67ab63b10718afcb3a47909f6644a1ee844dd9e6c2

            args:
              - --auto-httproute
              - --enable-httproute
              - --enable-service

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi

            restartPolicy: Always

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

        containers:
          gatus:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415

            env:
              GATUS_DELAY_START_SECONDS: 5
              GATUS_CONFIG_PATH: /config
              GATUS_WEB_PORT: &httpPort 8080

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /health
                    port: *httpPort
                  periodSeconds: 10

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      config:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi

      config-file:
        type: configMap
        name: gatus-configmap
        globalMounts:
          - path: /config/config.yaml
            readOnly: true
            subPath: config.yaml

    rbac:
      bindings:
        gatus:
          roleRef:
            identifier: gatus
          subjects:
            - kind: ServiceAccount
              name: gatus
              namespace: monitoring
          type: ClusterRoleBinding

      roles:
        gatus:
          rules:
            - apiGroups:
                - ""
              resources:
                - services
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - gateway.networking.k8s.io
              resources:
                - gateways
                - httproutes
              verbs:
                - get
                - list
                - watch
          type: ClusterRole

    route:
      gatus:
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"
          - status.idahobealefamily.com
        parentRefs:
          - name: envoy-external
            namespace: networking

    service:
      gatus:
        controller: gatus
        ports:
          http:
            port: *httpPort

    serviceAccount:
      gatus: {}
