---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pfsense
spec:
  staticConfigs:
    - targets:
        - pfsense.idahobealefamily.com:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: pfsense
