---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chartRef:
    kind: OCIRepository
    name: kyverno
  interval: 1h
  values:
    features:
      mutatingAdmissionPolicies:
        enabled: false
      # Reports are for config monitoring, not enforcement — trim their etcd
      # write churn. Drop transient admission (ephemeral) reports, only record
      # validate-rule results (not mutate/generate), and re-scan daily.
      admissionReports:
        enabled: false
      reporting:
        validate: true
        mutate: false
        mutateExisting: false
        generate: false
        imageVerify: false
      backgroundScan:
        backgroundScanInterval: 24h

    grafana:
      enabled: true

    admissionController:
      # HA: keep >1 admission replica so a single pod disruption (e.g. a tuppr
      # node drain) never empties kyverno-svc endpoints. With failurePolicy=Fail
      # webhooks, zero endpoints rejects cluster-wide writes and bricks the
      # control plane (KCM/scheduler crashloop). antiAffinity is on by default,
      # so replicas spread across nodes.
      replicas: 3
      podDisruptionBudget:
        # Explicit PDB (chart auto-enables one when replicas>1, but make it
        # declarative) so node drains can never evict all admission pods at once.
        enabled: true
        minAvailable: 1
      clusterRole:
        extraResources:
          - apiGroups:
              - "*"
            resources:
              - "*"
            verbs:
              - get
              - list
              - watch
      container:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      serviceMonitor:
        enabled: true

    backgroundController:
      clusterRole:
        extraResources:
          - apiGroups:
              - "*"
            resources:
              - "*"
            verbs:
              - get
              - list
              - watch
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
      serviceMonitor:
        enabled: true

    reportsController:
      clusterRole:
        extraResources:
          - apiGroups:
              - "*"
            resources:
              - "*"
            verbs:
              - get
              - list
              - watch
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi
      serviceMonitor:
        enabled: true

    cleanupController:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi
      serviceMonitor:
        enabled: true
