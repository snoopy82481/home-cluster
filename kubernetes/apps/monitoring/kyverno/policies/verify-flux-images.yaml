---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policies.kyverno.io/imagevalidatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-flux-images
  annotations:
    policies.kyverno.io/title: Verify Flux Images
    policies.kyverno.io/category: Flux
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.18.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Ensures that container images used to run Flux controllers in the cluster
      are signed with valid Cosign signatures. Prevents the deployment of untrusted
      or potentially compromised Flux images. Protects the integrity and security
      of the Flux deployment process.
spec:
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subjectRegExp: "^https://github[.]com/fluxcd/.*$"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: "https://rekor.sigstore.dev"
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: "ghcr.io/fluxcd/source-controller:*"
    - glob: "ghcr.io/fluxcd/kustomize-controller:*"
    - glob: "ghcr.io/fluxcd/helm-controller:*"
    - glob: "ghcr.io/fluxcd/notification-controller:*"
    - glob: "ghcr.io/fluxcd/image-reflector-controller:*"
    - glob: "ghcr.io/fluxcd/image-automation-controller:*"
    - glob: "docker.io/fluxcd/source-controller:*"
    - glob: "docker.io/fluxcd/kustomize-controller:*"
    - glob: "docker.io/fluxcd/helm-controller:*"
    - glob: "docker.io/fluxcd/notification-controller:*"
    - glob: "docker.io/fluxcd/image-reflector-controller:*"
    - glob: "docker.io/fluxcd/image-automation-controller:*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
  validationActions:
    - Audit
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image,  [attestors.cosign])).all(e, e > 0)
      message: "Failed image signature verification"
  webhookConfiguration:
    timeoutSeconds: 15
