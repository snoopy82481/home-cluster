---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minnieverse
spec:
  groups:
    - name: minnieverse.rules
      rules:
        - alert: minnieverseUnreachable
          expr: |
            up{site="minnieverse",job="node-exporter"} == 0
            or
            absent(up{site="minnieverse",job="node-exporter"})
          for: 5m
          labels:
            severity: critical
            site: minnieverse
          annotations:
            summary: "minnieverse is unreachable"
            description: "Prometheus cannot scrape minnieverse's Node Exporter."

        - alert: minnieversePiHoleExporterDown
          expr: |
            up{site="minnieverse",job="pihole-exporter"} == 0
            or
            absent(up{site="minnieverse",job="pihole-exporter"})
          for: 5m
          labels:
            severity: warning
            site: minnieverse
          annotations:
            summary: "minnieverse Pi-hole monitoring unavailable"
            description: "Prometheus cannot scrape the Pi-hole Exporter."

        - alert: minnieverseHighTemperature
          expr: |
            node_thermal_zone_temp{site="minnieverse"} > 75
          for: 5m
          labels:
            severity: warning
            site: minnieverse
          annotations:
            summary: "minnieverse temperature is high"
            description: "A reported thermal zone is above 75 degrees Celsius."

        - alert: minnieverseLowDiskSpace
          expr: |
            (
              node_filesystem_avail_bytes{site="minnieverse",mountpoint="/"}
              /
              node_filesystem_size_bytes{site="minnieverse",mountpoint="/"}
            ) * 100 < 15
          for: 15m
          labels:
            severity: warning
            site: minnieverse
          annotations:
            summary: "minnieverse is running low on storage"
            description: "Less than 15 percent of root filesystem space remains."

        - alert: minnieverseLowMemory
          expr: |
            (
              node_memory_MemAvailable_bytes{site="minnieverse"}
              /
              node_memory_MemTotal_bytes{site="minnieverse"}
            ) * 100 < 10
          for: 10m
          labels:
            severity: warning
            site: minnieverse
          annotations:
            summary: "minnieverse is running low on memory"
            description: "Less than 10 percent of system memory is available."
