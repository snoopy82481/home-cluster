---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minniverse
spec:
  groups:
    - name: minniverse.rules
      rules:
        - alert: MinniverseUnreachable
          expr: |
            up{site="minniverse",job="node-exporter"} == 0
            or
            absent(up{site="minniverse",job="node-exporter"})
          for: 5m
          labels:
            severity: critical
            site: minniverse
          annotations:
            summary: "Minniverse is unreachable"
            description: "Prometheus cannot scrape Minniverse's Node Exporter."

        - alert: MinniversePiHoleExporterDown
          expr: |
            up{site="minniverse",job="pihole-exporter"} == 0
            or
            absent(up{site="minniverse",job="pihole-exporter"})
          for: 5m
          labels:
            severity: warning
            site: minniverse
          annotations:
            summary: "Minniverse Pi-hole monitoring unavailable"
            description: "Prometheus cannot scrape the Pi-hole Exporter."

        - alert: MinniverseHighTemperature
          expr: |
            node_thermal_zone_temp{site="minniverse"} > 75
          for: 5m
          labels:
            severity: warning
            site: minniverse
          annotations:
            summary: "Minniverse temperature is high"
            description: "A reported thermal zone is above 75 degrees Celsius."

        - alert: MinniverseLowDiskSpace
          expr: |
            (
              node_filesystem_avail_bytes{site="minniverse",mountpoint="/"}
              /
              node_filesystem_size_bytes{site="minniverse",mountpoint="/"}
            ) * 100 < 15
          for: 15m
          labels:
            severity: warning
            site: minniverse
          annotations:
            summary: "Minniverse is running low on storage"
            description: "Less than 15 percent of root filesystem space remains."

        - alert: MinniverseLowMemory
          expr: |
            (
              node_memory_MemAvailable_bytes{site="minniverse"}
              /
              node_memory_MemTotal_bytes{site="minniverse"}
            ) * 100 < 10
          for: 10m
          labels:
            severity: warning
            site: minniverse
          annotations:
            summary: "Minniverse is running low on memory"
            description: "Less than 10 percent of system memory is available."
