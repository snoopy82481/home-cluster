---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: minniverse
spec:
  scrapeInterval: 60s
  scrapeTimeout: 15s
  metricsPath: /metrics

  staticConfigs:
    - targets:
        - minniverse.monitoring.svc.cluster.local:9100
      labels:
        job: node-exporter
        instance: minniverse
        site: minniverse
        environment: home
        platform: raspberry-pi

    - targets:
        - minniverse.monitoring.svc.cluster.local:9617
      labels:
        job: pihole-exporter
        instance: minniverse
        site: minniverse
        environment: home
        platform: raspberry-pi
