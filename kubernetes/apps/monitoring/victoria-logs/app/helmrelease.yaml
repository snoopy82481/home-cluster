---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      retentionPeriod: 14d
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: victoria-logs
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: si-victoriametrics
          gethomepage.dev/description: "Victoria Logs is a log aggregation and management solution built on top of VictoriaMetrics, designed to efficiently collect, store, and analyze log data from various sources."
          gethomepage.dev/app: victoria-logs-single
        hostnames:
          - victoria-logs.idahobealefamily.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
      service:
        annotations:
          lbipam.cilium.io/ips: 192.168.20.54
        externalTrafficPolicy: Cluster
        type: LoadBalancer
      serviceMonitor:
        enabled: true
      syslog:
        udp:
          - name: syslog-udp
            value: :1514
            streamFields: '["hostname","app_name"]'
        tcp:
          - name: syslog-tcp
            value: :1514
            streamFields: '["hostname","app_name"]'
