---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: *app
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      retentionPeriod: 14d
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: *app
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: si-victoriametrics
          gethomepage.dev/description: "Victoria Logs is a log aggregation and management solution built on top of VictoriaMetrics, designed to efficiently collect, store, and analyze log data from various sources."
          gethomepage.dev/app: victoria-logs-single
        hostnames:
          - victoria-logs.idahobealefamily.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
      serviceMonitor:
        enabled: true
