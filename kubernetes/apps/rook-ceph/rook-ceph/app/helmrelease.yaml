---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    # Set due to host processor not able to support AVX2 instructions, which are required by the default Ceph build.
    csi:
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1

    image:
      repository: ghcr.io/rook/ceph

    monitoring:
      enabled: true

    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
