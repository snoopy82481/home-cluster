---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  chartRef:
    kind: OCIRepository
    name: mealie
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    externalSecrets:
      mealie:
        data:
          - remoteRef:
              key: OPENROUTER_API_KEY
            secretKey: OPENROUTER_API_KEY
        dataFrom:
          - extract:
              key: MEALIE
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: doppler
        target:
          creationPolicy: Owner
          name: mealie-secrets
          template:
            data:
              OPENAI_API_KEY: "{{ .OPENROUTER_API_KEY }}"

    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: "v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f"

            env:
              API_DOCS: false
              ALLOW_SIGNUP: "false"
              BASE_URL: https://mealie.idahobealefamily.com
              SCRAPER_FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local.:8191
              PGID: 1000
              PUID: 1000
              TZ: America/Boise

            envFrom:
              - secretRef:
                  name: mealie-secrets

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/app/about
                    port: 9000
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /api/app/about
                    port: 9000
                  periodSeconds: 5
                  timeoutSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          gethomepage.dev/description: A self-hosted recipe manager and meal planner.
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/icon: mealie
          gethomepage.dev/name: Mealie
          gethomepage.dev/widget.type: mealie
          gethomepage.dev/version: "2"
          gethomepage.dev/widget.url: https://mealie.idahobealefamily.com
          gethomepage.dev/widget.key: "{{ `{{ HOMEPAGE_VAR_MEALIE_API_TOKEN }}` }}"
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"
          - recipes.idahobealefamily.com
        parentRefs:
          - name: envoy-external
            namespace: networking

    service:
      app:
        controller: mealie
        ports:
          http:
            port: 9000
