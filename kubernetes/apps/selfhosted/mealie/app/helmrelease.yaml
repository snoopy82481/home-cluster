---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  chartRef:
    kind: OCIRepository
    name: mealie
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    externalSecrets:
      mealie:
        data:
          - remoteRef:
              key: OPENROUTER_API_KEY
            secretKey: OPENROUTER_API_KEY
        dataFrom:
          - extract:
              key: MEALIE
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: doppler
        target:
          creationPolicy: Owner
          name: mealie-secrets
          template:
            data:
              OPENAI_API_KEY: "{{ .OPENROUTER_API_KEY }}"
              POSTGRES_PASSWORD: "{{ .MEALIE_POSTGRES_PASSWORD }}"
              POSTGRES_USER: mealie_app
              POSTGRES_SERVER: mealie-postgres-rw.selfhosted.svc.cluster.local
              POSTGRES_PORT: 5432

    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: "v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784"

            env:
              ALLOW_SIGNUP: "false"
              BASE_URL: https://mealie.idahobealefamily.com
              DB_ENGINE: postgres
              PGID: 1000
              POSTGRES_DB: mealie
              PUID: 1000
              OPENAI_BASE_URL: https://openrouter.ai/api/v1
              TZ: America/Boise

            envFrom:
              - secretRef:
                  name: mealie-secrets

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/app/about
                    port: 9000
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /api/app/about
                    port: 9000
                  periodSeconds: 5
                  timeoutSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.idahobealefamily.com"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: 9000

    service:
      app:
        controller: mealie
        ports:
          http:
            port: 9000
