---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-postgres
spec:
  affinity:
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: mealie
      owner: mealie
      secret:
        name: mealie-postgres-credentials
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  instances: 2
  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: ceph-block
