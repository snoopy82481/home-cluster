---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-credentials
spec:
  dataFrom:
    - extract:
        key: MEALIE
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: mealie-postgres-credentials
    template:
      data:
        password: "{{ .MEALIE_POSTGRES_PASSWORD }}"
        username: mealie
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-app
spec:
  dataFrom:
    - extract:
        key: MEALIE
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: mealie-postgres-app
    template:
      data:
        password: "{{ .MEALIE_POSTGRES_APP_PASSWORD }}"
        username: mealie_app
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
